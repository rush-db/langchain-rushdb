[project]
name = "langchain-rushdb"
version = "0.1.0"
description = "LangChain and LangGraph integration for RushDB: vector store, hybrid retriever, long-term memory store and checkpointer, on RushDB Cloud or self-hosted"
authors = [{ name = "RushDB Team", email = "hi@rushdb.com" }]
license = { text = "Apache-2.0" }
readme = "README.md"
requires-python = ">=3.10"
keywords = [
  "rushdb",
  "langchain",
  "langgraph",
  "vector store",
  "hybrid search",
  "checkpointer",
  "agent memory",
  "rag",
  "self-hosted",
]
dependencies = [
  "rushdb>=3.2.0,<4",
  "langchain-core>=1.0,<2",
  "langgraph-checkpoint>=4.0,<5",
  "langgraph>=1.0,<2",
]

[project.urls]
Homepage = "https://github.com/rush-db/langchain-rushdb"
Repository = "https://github.com/rush-db/langchain-rushdb"
Documentation = "https://docs.rushdb.com/integrations/langchain"

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "langchain-tests>=1.1,<2",
  "langgraph-checkpoint-conformance>=0.0.2",
  "ruff>=0.8",
  "mypy>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["langchain_rushdb"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = ["integration: needs a RushDB backend (see tests/README)"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true
